<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gioush Judge</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="eyebrow">Gioush Local OJ</div>
      <h1>补题评测器</h1>
    </div>
    <div class="account" id="accountBox"></div>
  </header>

  <main class="layout">
    <section class="panel auth-panel">
      <div class="tabs">
        <button class="tab active" data-tab="login">登录</button>
        <button class="tab" data-tab="register">注册</button>
      </div>
      <form id="loginForm" class="form">
        <label>Handle<input name="handle" autocomplete="username"></label>
        <label>密码<input name="password" type="password" autocomplete="current-password"></label>
        <button type="submit">登录</button>
      </form>
      <form id="registerForm" class="form hidden">
        <label>昵称<input name="name" autocomplete="name"></label>
        <label>Handle<input name="handle" autocomplete="username"></label>
        <label>密码<input name="password" type="password" autocomplete="new-password"></label>
        <button type="submit">注册并登录</button>
      </form>
      <p class="hint">账号只保存在本机，不用于公网排名。</p>
    </section>

    <section class="panel judge-panel">
      <div class="panel-head">
        <div>
          <div class="eyebrow">Judge</div>
          <h2>提交评测</h2>
        </div>
        <button id="refreshBtn" class="ghost">刷新</button>
      </div>
      <div class="judge-grid">
        <label>题目<select id="problemSelect"></select></label>
        <label>源文件路径<input id="sourcePath" placeholder="D:\Code\main.cpp"></label>
      </div>
      <div class="actions">
        <button id="runBtn">开始评测</button>
        <button id="exportBtn" class="ghost">导出报告</button>
      </div>
      <div class="progress"><span id="progressBar"></span></div>
      <pre id="output" class="output">等待评测。</pre>
    </section>

    <section class="panel list-panel">
      <div class="panel-head">
        <div>
          <div class="eyebrow">Problems</div>
          <h2>题目列表</h2>
        </div>
        <div class="counter" id="counter">0 / 0</div>
      </div>
      <div id="problemCards" class="cards"></div>
    </section>

    <section class="panel records-panel">
      <div class="panel-head">
        <div>
          <div class="eyebrow">Records</div>
          <h2>本地记录</h2>
        </div>
      </div>
      <div id="records" class="records"></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
