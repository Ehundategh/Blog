name: Deploy MkDocs

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build Windows judge package
        shell: pwsh
        run: |
          $publish = "build/gioush-judge-win"
          Remove-Item -LiteralPath $publish -Recurse -Force -ErrorAction SilentlyContinue
          dotnet publish tools/gioush-judge-app/GioushJudge/GioushJudge.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o $publish
          Copy-Item -LiteralPath tools/gioush-judge-win/gioush-judge.ps1 -Destination $publish -Force
          Copy-Item -LiteralPath tools/gioush-judge-win/gioush-judge.cmd -Destination $publish -Force
          Copy-Item -LiteralPath tools/gioush-judge-win/README.md -Destination $publish -Force
          Compress-Archive -Path "$publish/*" -DestinationPath docs/assets/oj/gioush-judge-windows.zip -Force

      - name: Build site
        run: mkdocs build --strict

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
