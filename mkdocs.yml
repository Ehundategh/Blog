site_name: Gioush OI Website
site_description: Ehundategh 维护的 OI 知识点与题解收录。

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式

plugins:
  - search:
      lang:
        - zh
        - en
  - glightbox

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - javascripts/katex.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js

extra_css:
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css
  - stylesheets/extra.css

nav:
  - 首页: index.md
  - 数据结构:
      - 总览: data-structure/index.md
      - ST 表: data-structure/st-table.md
      - 树状数组: data-structure/binary-indexed-tree.md
      - 平衡树:
          - 总览: data-structure/balanced-tree/index.md
          - 二叉搜索树: data-structure/balanced-tree/binary-search-tree.md
          - Splay: data-structure/balanced-tree/splay.md
          - Treap: data-structure/balanced-tree/treap.md
      - 线段树:
          - 总览: data-structure/segment-tree/index.md
          - 线段树基础: data-structure/segment-tree/basic.md
          - 扫描线: data-structure/segment-tree/scanline.md
          - 双半群模型: data-structure/segment-tree/double-semigroup.md
          - 线段树合并: data-structure/segment-tree/merge.md
  - 字符串:
      - 总览: string/index.md
      - 字符串 Hash: string/hash.md
      - 后缀数组: string/suffix-array.md
  - 数学:
      - 总览: math/index.md
      - 抽象代数: math/abstract-algebra.md
      - 数论:
          - 总览: math/number-theory/index.md
          - 基础数论: math/number-theory/basic.md
      - 线性代数:
          - 总览: math/linear-algebra/index.md
          - 矩阵与线性方程组: math/linear-algebra/matrix-equations.md
          - 线性空间与线性映射: math/linear-algebra/linear-map.md
      - 组合数学:
          - 总览: math/combinatorics/index.md
          - 容斥原理: math/combinatorics/inclusion-exclusion.md
      - 概率论初步:
          - 总览: math/probability/index.md
          - 概率的基本概念: math/probability/basic.md
          - 条件概率与 Bayes 公式: math/probability/conditional-bayes.md
          - 随机变量、期望与方差: math/probability/random-variable.md
  - 动态规划:
      - 总览: dp/index.md
      - 单调队列优化 DP: dp/monotone-queue.md
  - 图论:
      - 总览: graph/index.md
      - Tarjan 与图连通性:
          - 总览: graph/tarjan/index.md
          - 强连通分量: graph/tarjan/scc.md
          - 割点、桥与边双: graph/tarjan/cut-bridge-edcc.md
          - 点双连通分量: graph/tarjan/vdcc.md
      - 树上问题:
          - 总览: graph/tree/index.md
          - 树的直径: graph/tree/diameter.md
          - 树的重心: graph/tree/centroid.md
  - 计算几何:
